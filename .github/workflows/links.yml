# Link check: fails on a dead link in README.md, SKILL.md or references/**/*.md.
# Runs on every PR to dev and main, weekly and by hand. Settings, and every excluded
# host with its reason, are in lychee.toml.
name: links
on:
  pull_request:
    branches: [dev, main]
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC; scheduled runs use this file as it is on main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check links (lychee)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          fail: true
          args: >-
            --no-progress
            --config lychee.toml
            README.md SKILL.md 'references/**/*.md'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
