# Runs on every PR and on pushes to dev/main: syntax checks for the skill's scripts,
# a wording guard (CONTRIBUTING.md, "Wording rules"), and a check for leftover placeholders.
name: ci
on:
  pull_request:
  push:
    branches: [main, dev]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python and bash syntax
        run: |
          python3 -m py_compile scripts/*.py scripts/payload/common/*.py
          bash -n scripts/payload/exit/install.sh scripts/payload/relay/install.sh scripts/payload/common/*.sh
      - name: Plugin wrapper and manifests in sync
        run: |
          python3 - <<'PY'
          import json, re
          def fm(path):
              t = open(path, encoding="utf-8").read()
              block = re.match(r"^---\n(.*?)\n---\n", t, re.S).group(1)
              return dict(re.findall(r"^(name|description):\s*(.*)$", block, re.M))
          root, wrap = fm("SKILL.md"), fm("skills/homeport/SKILL.md")
          assert root == wrap, "skills/homeport/SKILL.md frontmatter must equal SKILL.md's: regenerate it"
          plugin = json.load(open(".claude-plugin/plugin.json"))
          market = json.load(open(".claude-plugin/marketplace.json"))
          assert plugin["name"] == "homeport" and market["plugins"][0]["name"] == "homeport" and market["name"] == "homeport"
          assert market["plugins"][0]["source"] == "./"
          assert market["plugins"][0].get("version") == plugin["version"], "version differs between plugin.json and marketplace.json"
          latest = re.search(r"^## (\d+\.\d+\.\d+)", open("CHANGELOG.md", encoding="utf-8").read(), re.M).group(1)
          assert latest == plugin["version"], f"plugin version {plugin['version']} != latest CHANGELOG entry {latest}"
          import os
          for m in re.findall(r"\]\((providers/[a-z0-9-]+\.md)\)", open("references/provisioning.md", encoding="utf-8").read()):
              assert os.path.exists("references/" + m), f"provisioning.md links to missing {m}"
          PY
      - name: No secrets in the tree
        run: |
          ! grep -rnE 'dop_v1_[A-Za-z0-9]{20,}|tk_[a-z0-9]{20,}|BEGIN (RSA|OPENSSH|EC) PRIVATE' --exclude-dir=.git . || (echo "possible secret committed" && exit 1)
      - name: Wording guard (no country-specific terms, no old product name)
        run: bash .github/wording-guard.sh
      - name: No placeholders on main
        if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
        run: |
          ! grep -rn '{{[A-Z_]*}}' README.md SECURITY.md .github/ISSUE_TEMPLATE/ || (echo "fill the placeholders before main" && exit 1)
